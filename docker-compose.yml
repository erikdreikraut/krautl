services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: krautl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: krautl
    volumes:
      - krautl_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krautl"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: krautl-app
    restart: unless-stopped
    init: true
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "172.17.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: krautl-app
    restart: unless-stopped
    init: true
    command: ["python", "-m", "app.worker_service"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8081:80"

volumes:
  krautl_db:
